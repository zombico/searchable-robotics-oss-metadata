name: research-and-contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python compile_example.py
      - run: python validate.py
      - run: python -m unittest discover -s tests -v
      - run: python verify_release.py fixtures/episode.json
      - run: python verify_release.py fixtures/release.json
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-sim.txt
      - run: python compile_example.py
      - run: git diff --exit-code example.urdf example.mjcf.xml
      - run: python smoke_sim.py
      - run: python -m unittest tests.test_engine -v
        env:
          REQUIRE_ENGINE: '1'
