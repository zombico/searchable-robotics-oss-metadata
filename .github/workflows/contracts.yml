name: research-and-contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python compile_example.py
      - run: python validate.py
      - run: python -m unittest discover -s tests -v
      - run: python verify_release.py fixtures/episode.json
      - run: python verify_release.py fixtures/release.json
      - run: python verify_release.py evidence/example_gripper/episode.json
      - run: python verify_release.py evidence/example_gripper/release.json
      - run: python tasks/pick/scene.py
      - run: git diff --exit-code tasks/pick/pick_scene.mjcf.xml
      - run: python compose/pick_gripper.py --screen-only
      - run: python electronics/build_components.py
      - run: git diff --exit-code electronics/components.json
      - run: python electronics/swap.py electronics/bindings/so101_follower.json --audit
      - run: python electronics/swap.py electronics/bindings/so101_follower_12v.json --budget
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-sim.txt
      - run: python compile_example.py
      - run: git diff --exit-code example.urdf example.mjcf.xml
      - run: python smoke_sim.py
      - run: python engine_check.py --out "$RUNNER_TEMP/evidence"
      - run: python engine_check.py --replay evidence/example_gripper/episode.json
      - run: python tasks/pick/generate.py --episodes 50 --out "$RUNNER_TEMP/pick"
      - run: python tasks/pick/generate.py --replay tasks/pick/sample/pick-v0-seed0_success.json
      - run: python tasks/pick/generate.py --replay tasks/pick/sample/pick-v0-seed1_slip.json
      - run: python compose/pick_gripper.py --seeds 10 --out "$RUNNER_TEMP/compose"
      - run: python -m unittest tests.test_engine tests.test_pick_engine tests.test_compose -v
        env:
          REQUIRE_ENGINE: '1'
